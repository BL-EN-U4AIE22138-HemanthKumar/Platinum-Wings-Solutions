<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Platinum Wings Solutions</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->

        <div class="left-panel">

            <div class="overlay"></div>

            <div class="left-content">

                <h1>Platinum Wings Solutions</h1>

                <p>
                    Smart Healthcare. Zero Waiting. Instant Care.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="right-panel">

            <div class="form-container">

                <!-- LOGIN FORM -->

                <form class="form login-form active">

                    <h2>Login</h2>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            placeholder="Email Address"
                            required>

                    </div>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            placeholder="Password"
                            required>

                    </div>

                    <button type="submit">
                        Login
                    </button>

                    <p class="switch-text">
                        Don't have an account?
                        <span id="showSignup">
                            Create Account
                        </span>
                    </p>

                </form>



                <!-- SIGNUP FORM -->

                <form class="form signup-form">

                    <h2>Create Account</h2>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            placeholder="Full Name"
                            required>

                    </div>


                    <div class="input-box">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            placeholder="Phone Number"
                            required>

                    </div>


                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            placeholder="Email Address"
                            required>

                    </div>


                    <div class="input-box">

                        <i class="fa-solid fa-cake-candles"></i>

                        <input
                            type="number"
                            placeholder="Age"
                            required>

                    </div>


                    <div class="input-box">

                        <i class="fa-solid fa-venus-mars"></i>

                        <select required>

                            <option value="">
                                Select Gender
                            </option>

                            <option>
                                Male
                            </option>

                            <option>
                                Female
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>


                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            placeholder="Create Password"
                            required>

                    </div>

                    <button type="submit">
                        Create Account
                    </button>

                    <p class="switch-text">
                        Already have an account?
                        <span id="showLogin">
                            Login
                        </span>
                    </p>

                </form>

            </div>

        </div>

    </div>

    <!-- JS -->
    <script src="../JS/login.js"></script>

</body>

</html>
